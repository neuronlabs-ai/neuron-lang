[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pycheck-neuron"
version = "0.2.0"
description = "30-rule static AST analyzer that catches temporal lookahead bias, causal confusion, and uncertainty bugs in Python ML scripts."
readme = "README.md"
authors = [{ name = "NEURON Team" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Financial and Insurance Industry",
    "Development Status :: 4 - Beta",
]
keywords = [
    "machine-learning", "data-leakage", "temporal-bias", "lookahead",
    "backtesting", "trading", "linter", "static-analysis", "causal",
    "uncertainty", "neuron"
]
requires-python = ">=3.7"
dependencies = []

[project.urls]
Homepage = "https://github.com/neuron-lang/pycheck"
Documentation = "https://github.com/neuron-lang/pycheck#readme"
Repository = "https://github.com/neuron-lang/pycheck"

[project.scripts]
pycheck = "pycheck.cli:main"

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
testpaths = ["tests"]

